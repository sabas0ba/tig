[package]
name = "tig-web"
description = "tig (tiny git) のブラウザ向け frontend (wasm32-unknown-unknown、C ABI + 手書き JS glue)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tig-core = { path = "../core", features = ["bundle", "history", "fetch"] }
