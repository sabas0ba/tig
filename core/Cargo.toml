[package]
name = "tig-core"
description = "no_std git client core: object / pack / bundle parsing and history walk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# packfile v2 の解析と delta 解決
pack = []
# bundle (v2/v3) の読み書き。pack を内包する
bundle = ["pack"]
# committer date 順の history walk
history = []
# protocol v2 の request 構築と response 解析 (sans-io、HTTP client は含まない)
transport-http = []
# smart HTTP からの clone 状態機械
fetch = ["transport-http", "bundle"]
# object (tree / commit) の生成と packfile の書き出し (writer は pack module にある)
write = ["pack"]
# smart HTTP への push 状態機械 (receive-pack、protocol v0)
push = ["write", "transport-http"]
# tree の展開 (filesystem は frontend の責務)
checkout = []

[lib]
name = "tig_core"
